name: Deploy EduJustice to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: /edujustice/
          VITE_FIREBASE_API_KEY: AIzaSyDAHTxsPFymW9PPWCuTS2jJuqRVdSvWIsc
          VITE_FIREBASE_AUTH_DOMAIN: edujustice-pika-2026.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: edujustice-pika-2026
          VITE_FIREBASE_STORAGE_BUCKET: edujustice-pika-2026.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 132524080500
          VITE_FIREBASE_APP_ID: 1:132524080500:web:fd007f25351b2c7c08c021
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
